name: staging-authorization

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full lowercase source commit SHA from the verified candidate
        required: true
        type: string
      source_state_hash:
        description: SHA-256 source-state hash from the signed candidate attestation
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the canonical sanitized provenance manifest
        required: true
        type: string
      publish_workflow_sha:
        description: Full workflow SHA recorded in the signed candidate attestation
        required: true
        type: string
      backend_image:
        description: Exact backend GHCR digest reference
        required: true
        type: string
      frontend_image:
        description: Exact frontend GHCR digest reference
        required: true
        type: string

permissions: {}

concurrency:
  group: staging-authorization
  cancel-in-progress: false

env:
  EXPECTED_CONTROL_REPOSITORY: omnisec-ops/omnisec-staging-control
  EXPECTED_AUTHORIZATION_WORKFLOW_IDENTITY: https://github.com/omnisec-ops/omnisec-staging-control/.github/workflows/staging-authorization.yml@refs/heads/main
  EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  pre-approval-verification:
    if: >-
      github.repository == 'omnisec-ops/omnisec-staging-control' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the immutable control policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to private GHCR packages with the ephemeral workflow token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Verify exact candidate signatures and attestations before review
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SOURCE_STATE_HASH: ${{ inputs.source_state_hash }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PUBLISH_WORKFLOW_SHA: ${{ inputs.publish_workflow_sha }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: >-
          node scripts/verify-candidate.mjs
          "$SOURCE_REVISION" "$SOURCE_STATE_HASH" "$MANIFEST_SHA256"
          "$PUBLISH_WORKFLOW_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
          "$RUNNER_TEMP/pre-approval-candidate.json"

  approve-and-sign:
    needs: pre-approval-verification
    if: >-
      github.repository == 'omnisec-ops/omnisec-staging-control' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    permissions:
      actions: read
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Check out the immutable control policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the pinned Node runtime action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to private GHCR packages with the ephemeral workflow token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: Reverify candidate after approval
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          SOURCE_STATE_HASH: ${{ inputs.source_state_hash }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PUBLISH_WORKFLOW_SHA: ${{ inputs.publish_workflow_sha }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: >-
          node scripts/verify-candidate.mjs
          "$SOURCE_REVISION" "$SOURCE_STATE_HASH" "$MANIFEST_SHA256"
          "$PUBLISH_WORKFLOW_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
          "$RUNNER_TEMP/verified-candidate.json"
      - name: Verify independent environment reviewer evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-review-evidence.mjs "$RUNNER_TEMP/review-evidence.json"
      - name: Generate the bounded 0-percent authorization
        run: >-
          node scripts/generate-authorization.mjs
          "$RUNNER_TEMP/verified-candidate.json"
          "$RUNNER_TEMP/review-evidence.json"
          "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/deployment-authorization.json"
      - name: Keylessly sign the authorization with GitHub OIDC
        run: >-
          cosign sign-blob --yes
          --bundle "$RUNNER_TEMP/authorization-signature.bundle"
          "$RUNNER_TEMP/deployment-authorization.json"
      - name: Verify the authorization signature before publication
        run: >-
          cosign verify-blob
          --bundle "$RUNNER_TEMP/authorization-signature.bundle"
          --certificate-identity "$EXPECTED_AUTHORIZATION_WORKFLOW_IDENTITY"
          --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER"
          --certificate-github-workflow-name staging-authorization
          --certificate-github-workflow-repository "$EXPECTED_CONTROL_REPOSITORY"
          --certificate-github-workflow-ref refs/heads/main
          --certificate-github-workflow-trigger workflow_dispatch
          --certificate-github-workflow-sha "$GITHUB_SHA"
          --check-claims=true
          "$RUNNER_TEMP/deployment-authorization.json" >/dev/null
      - name: Upload the one-day authorization bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-authorization-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/deployment-authorization.json
            ${{ runner.temp }}/authorization-signature.bundle
